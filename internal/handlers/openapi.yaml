openapi: 3.0.3
info:
  title: Consultation Service API
  description: API сервиса записи студентов на консультации к преподавателям.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Локальный сервер
tags:
  - name: Slots
    description: Слоты консультаций преподавателей
  - name: Bookings
    description: Записи студентов на консультации
paths:
  /slots:
    post:
      tags:
        - Slots
      summary: Создать слот консультации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSlotRequest'
            example:
              teacher_id: 1
              discipline_id: 2
              starts_at: '2026-10-07T10:00:00Z'
              ends_at: '2026-10-07T11:00:00Z'
              capacity: 3
      responses:
        '201':
          description: Слот создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Слот пересекается с существующим слотом преподавателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/{id}/slots:
    get:
      tags:
        - Slots
      summary: Получить список слотов преподавателя
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Список слотов преподавателя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsultationSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /bookings:
    post:
      tags:
        - Bookings
      summary: Записаться на консультацию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              student_id: 10
              slot_id: 5
      responses:
        '201':
          description: Запись создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: В слоте нет свободных мест
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /bookings/{id}:
    delete:
      tags:
        - Bookings
      summary: Отменить запись студента
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: student_id
          in: query
          required: true
          description: Идентификатор студента-владельца записи
          schema:
            type: integer
            format: uint
            minimum: 1
      responses:
        '204':
          description: Запись отменена
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{id}/bookings:
    get:
      tags:
        - Bookings
      summary: Получить список записей студента
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Список записей студента
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Идентификатор ресурса
      schema:
        type: integer
        format: uint
        minimum: 1
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateSlotRequest:
      type: object
      required:
        - teacher_id
        - discipline_id
        - starts_at
        - ends_at
      properties:
        teacher_id:
          type: integer
          format: uint
          minimum: 1
        discipline_id:
          type: integer
          format: uint
          minimum: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
          default: 1
    CreateBookingRequest:
      type: object
      required:
        - student_id
        - slot_id
      properties:
        student_id:
          type: integer
          format: uint
          minimum: 1
        slot_id:
          type: integer
          format: uint
          minimum: 1
    ConsultationSlot:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        TeacherID:
          type: integer
          format: uint
        DisciplineID:
          type: integer
          format: uint
        StartsAt:
          type: string
          format: date-time
        EndsAt:
          type: string
          format: date-time
        Capacity:
          type: integer
    Booking:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        StudentID:
          type: integer
          format: uint
        SlotID:
          type: integer
          format: uint
        Slot:
          $ref: '#/components/schemas/ConsultationSlot'
        Status:
          type: string
          enum:
            - active
            - cancelled
            - done
        CreatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
